<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marie — Profile</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');

        :root {
            --bg: #07060b;

            --text: #f8f5fc;
            --text-soft: #c9c2d3;
            --muted: #8f879b;
            --dim: #686173;

            --purple: #a78bfa;
            --purple-bright: #c4aaff;
            --pink: #efa9cb;

            --border: rgba(190, 157, 255, .16);
            --border-strong: rgba(190, 157, 255, .28);

            --card: rgba(20, 17, 29, .78);
        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            min-height: 100vh;

            padding: 55px 20px;

            background: var(--bg);

            color: var(--text);

            font-family:
                "DM Sans",
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            display: flex;
            justify-content: center;

            overflow-x: hidden;
        }


        /* =========================================================
           BACKGROUND
        ========================================================= */

        .background {
            position: fixed;
            inset: 0;

            z-index: -10;

            overflow: hidden;

            background:
                radial-gradient(
                    ellipse 650px 500px at 50% -10%,
                    rgba(151, 105, 230, .22),
                    transparent 70%
                ),

                radial-gradient(
                    ellipse 500px 600px at 100% 75%,
                    rgba(111, 76, 180, .10),
                    transparent 70%
                ),

                radial-gradient(
                    ellipse 500px 500px at 0% 65%,
                    rgba(213, 119, 171, .045),
                    transparent 70%
                ),

                #07060b;
        }


        .ambient {
            position: absolute;

            width: 850px;
            height: 850px;

            top: -650px;
            left: 50%;

            transform: translateX(-50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(183, 137, 250, .20),
                    rgba(183, 137, 250, .04) 45%,
                    transparent 70%
                );

            filter: blur(20px);

            animation:
                ambientPulse 8s ease-in-out infinite alternate;
        }


        @keyframes ambientPulse {

            from {
                opacity: .65;
                transform:
                    translateX(-50%)
                    scale(.94);
            }

            to {
                opacity: 1;
                transform:
                    translateX(-50%)
                    scale(1.06);
            }

        }


        .stars {
            position: absolute;
            inset: 0;

            opacity: .65;

            background-image:

                radial-gradient(
                    circle at 8% 15%,
                    rgba(255,255,255,.65) 0 1px,
                    transparent 1.5px
                ),

                radial-gradient(
                    circle at 19% 42%,
                    rgba(255,255,255,.25) 0 1px,
                    transparent 1.5px
                ),

                radial-gradient(
                    circle at 34% 11%,
                    rgba(255,255,255,.35) 0 1px,
                    transparent 1.5px
                ),

                radial-gradient(
                    circle at 52% 25%,
                    rgba(255,255,255,.22) 0 1px,
                    transparent 1.5px
                ),

                radial-gradient(
                    circle at 70% 9%,
                    rgba(255,255,255,.40) 0 1px,
                    transparent 1.5px
                ),

                radial-gradient(
                    circle at 82% 34%,
                    rgba(255,255,255,.28) 0 1px,
                    transparent 1.5px
                ),

                radial-gradient(
                    circle at 91% 72%,
                    rgba(255,255,255,.35) 0 1px,
                    transparent 1.5px
                );
        }


        .grain {
            position: fixed;
            inset: 0;

            z-index: 50;

            pointer-events: none;

            opacity: .025;

            background-image:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }


        /* =========================================================
           PAGE
        ========================================================= */

        .page {
            width: 100%;
            max-width: 470px;

            position: relative;
            z-index: 2;

            animation:
                pageIn .8s cubic-bezier(.16,1,.3,1);
        }


        @keyframes pageIn {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================================================
           PROFILE
        ========================================================= */

        .profile {
            text-align: center;

            padding:
                10px
                10px
                29px;
        }


        .avatar-wrap {
            width: 118px;
            height: 118px;

            margin:
                0 auto
                23px;

            position: relative;
        }


        .avatar-glow {
            position: absolute;

            inset: -16px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(167,139,250,.32),
                    rgba(240,166,200,.10) 45%,
                    transparent 70%
                );

            filter: blur(13px);

            animation:
                avatarGlow 5s ease-in-out infinite alternate;
        }


        @keyframes avatarGlow {

            from {
                opacity: .55;
                transform: scale(.94);
            }

            to {
                opacity: 1;
                transform: scale(1.08);
            }

        }


        .avatar-ring {
            position: absolute;

            inset: -4px;

            border-radius: 50%;

            background:
                conic-gradient(
                    from 220deg,
                    #8fbfff,
                    #efa9cb,
                    #ffffff,
                    #b99af1,
                    #8fbfff
                );

            opacity: .9;

            animation:
                ringRotate 12s linear infinite;
        }


        @keyframes ringRotate {

            to {
                transform: rotate(360deg);
            }

        }


        .avatar {
            position: relative;

            width: 118px;
            height: 118px;

            display: block;

            object-fit: cover;

            border-radius: 50%;

            border:
                3px solid
                #09080d;

            box-shadow:
                0 18px 55px rgba(0,0,0,.65);
        }


        .name {
            font-family:
                "Playfair Display",
                Georgia,
                serif;

            font-size: 44px;

            line-height: 1;

            font-weight: 600;

            letter-spacing: -1.7px;

            margin-bottom: 14px;

            background:
                linear-gradient(
                    115deg,
                    #ffffff 10%,
                    #f1e9fb 48%,
                    #d7b8ee 100%
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            text-shadow:
                0 0 35px rgba(182,142,241,.10);
        }


        /* =========================================================
           IDENTITY
        ========================================================= */

        .identity {
            display: flex;

            align-items: center;
            justify-content: center;

            flex-wrap: wrap;

            gap: 8px;

            margin-bottom: 12px;

            font-size: 13px;
        }


        .identity strong {
            color: #eee8f4;

            font-weight: 600;
        }


        .identity .dot {
            color: #635a6e;
        }


        .bio-description {
            max-width: 350px;

            margin: auto;

            color: #b0a8bb;

            font-size: 13px;

            line-height: 1.7;

            font-weight: 500;
        }


        .location {
            display: inline-flex;

            align-items: center;

            gap: 7px;

            margin-top: 15px;

            color: #847b91;

            font-size: 11px;

            letter-spacing: .4px;
        }


        .location i {
            color: var(--pink);

            font-size: 10px;

            filter:
                drop-shadow(
                    0 0 7px
                    rgba(239,169,203,.45)
                );
        }


        /* =========================================================
           CLOCK
        ========================================================= */

        .clock-card {
            position: relative;

            display: flex;

            align-items: center;
            justify-content: space-between;

            margin:
                3px
                0
                25px;

            padding:
                14px
                16px;

            overflow: hidden;

            border-radius: 18px;

            border:
                1px solid
                rgba(180,145,245,.15);

            background:
                linear-gradient(
                    110deg,
                    rgba(131,96,190,.12),
                    rgba(255,255,255,.035) 55%,
                    rgba(215,132,181,.055)
                );

            box-shadow:
                inset 0 1px 0
                    rgba(255,255,255,.055),

                0 15px 40px
                    rgba(0,0,0,.20);
        }


        .clock-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 14%;

            width: 72%;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(210,181,255,.45),
                    transparent
                );

            opacity: .7;
        }


        .clock-left {
            display: flex;

            align-items: center;

            gap: 11px;
        }


        .clock-icon {
            width: 36px;
            height: 36px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 11px;

            background:
                linear-gradient(
                    145deg,
                    rgba(167,139,250,.19),
                    rgba(239,169,203,.07)
                );

            border:
                1px solid
                rgba(189,158,250,.16);

            color: #c5a9f2;

            box-shadow:
                0 0 20px
                rgba(167,139,250,.09);
        }


        .clock-info {
            text-align: left;
        }


        .clock-label {
            display: block;

            color: #83798f;

            font-size: 9px;

            text-transform: uppercase;

            letter-spacing: 1.5px;

            font-weight: 700;
        }


        .clock-time {
            display: block;

            margin-top: 2px;

            color: #f0eaf5;

            font-size: 14px;

            font-weight: 600;
        }


        .clock-zone {
            color: #83798e;

            font-size: 10px;

            line-height: 1.5;

            text-align: right;
        }


        /* =========================================================
           SECTION LABEL
        ========================================================= */

        .section-label {
            display: flex;

            align-items: center;

            gap: 10px;

            margin:
                0
                4px
                12px;

            color: #91879d;

            font-size: 9px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 2px;
        }


        .section-label::after {
            content: "";

            height: 1px;

            flex: 1;

            background:
                linear-gradient(
                    90deg,
                    rgba(180,145,245,.18),
                    transparent
                );
        }


        /* =========================================================
           SOCIAL LINKS
        ========================================================= */

        .links {
            display: flex;

            flex-direction: column;

            gap: 10px;
        }


        .link {
            position: relative;

            min-height: 66px;

            display: flex;

            align-items: center;

            padding:
                0
                17px;

            overflow: hidden;

            border-radius: 18px;

            border:
                1px solid
                var(--border);

            background:
                linear-gradient(
                    110deg,
                    rgba(38,31,52,.82),
                    rgba(20,18,28,.88)
                );

            color: var(--text);

            text-decoration: none;

            box-shadow:
                inset 0 1px 0
                    rgba(255,255,255,.045),

                0 10px 30px
                    rgba(0,0,0,.20);

            transition:
                transform .3s cubic-bezier(.16,1,.3,1),
                border-color .3s ease,
                box-shadow .3s ease;
        }


        /*
            Permanent highlight.
            This is what makes the cards visible before hover.
        */

        .link::before {
            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    105deg,
                    rgba(167,139,250,.11),
                    transparent 40%,
                    rgba(239,169,203,.045)
                );

            pointer-events: none;
        }


        .link::after {
            content: "";

            position: absolute;

            left: 0;
            top: 18%;

            width: 2px;
            height: 64%;

            border-radius: 10px;

            background:
                linear-gradient(
                    180deg,
                    transparent,
                    var(--purple),
                    var(--pink),
                    transparent
                );

            opacity: .75;

            box-shadow:
                0 0 14px
                rgba(167,139,250,.45);
        }


        .link:hover {
            transform:
                translateY(-3px)
                scale(1.005);

            border-color:
                var(--border-strong);

            box-shadow:
                inset 0 1px 0
                    rgba(255,255,255,.08),

                0 17px 42px
                    rgba(0,0,0,.36),

                0 0 25px
                    rgba(167,139,250,.07);
        }


        .link-icon {
            position: relative;
            z-index: 1;

            width: 41px;
            height: 41px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin-right: 13px;

            border-radius: 12px;

            background:
                linear-gradient(
                    145deg,
                    rgba(167,139,250,.15),
                    rgba(255,255,255,.045)
                );

            border:
                1px solid
                rgba(200,170,255,.13);

            color: #e0d8e9;

            font-size: 16px;

            box-shadow:
                inset 0 1px 0
                    rgba(255,255,255,.055),

                0 5px 18px
                    rgba(0,0,0,.18);

            transition:
                transform .3s ease,
                background .3s ease,
                color .3s ease;
        }


        .link:hover .link-icon {
            transform: scale(1.05);
        }


        .link-info {
            position: relative;
            z-index: 1;

            display: flex;

            flex-direction: column;

            gap: 3px;

            text-align: left;
        }


        .link-title {
            color: #f3edf7;

            font-size: 13px;

            font-weight: 600;
        }


        .link-subtitle {
            color: #91899b;

            font-size: 10px;
        }


        .link-arrow {
            position: relative;
            z-index: 1;

            margin-left: auto;

            color: #81788d;

            font-size: 10px;

            transition:
                transform .3s ease,
                color .3s ease;
        }


        .link:hover .link-arrow {
            transform: translateX(4px);

            color: #c9b7dc;
        }


        /* DISCORD */

        .discord {
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.045),
                0 10px 30px rgba(0,0,0,.20),
                0 0 25px rgba(88,101,242,.035);
        }


        .discord .link-icon {
            background:
                linear-gradient(
                    145deg,
                    rgba(88,101,242,.22),
                    rgba(88,101,242,.055)
                );

            color: #aeb4ff;

            border-color:
                rgba(120,130,255,.18);
        }


        .discord:hover {
            border-color:
                rgba(110,120,255,.32);
        }


        /* ROBLOX */

        .roblox .link-icon {
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.13),
                    rgba(255,255,255,.035)
                );

            border-color:
                rgba(255,255,255,.13);
        }


        .roblox-logo {
            width: 18px;
            height: 18px;

            filter:
                brightness(0)
                invert(1);

            opacity: .9;
        }


        .roblox:hover {
            border-color:
                rgba(255,255,255,.24);
        }


        /* SPOTIFY */

        .spotify .link-icon {
            background:
                linear-gradient(
                    145deg,
                    rgba(29,185,84,.17),
                    rgba(29,185,84,.035)
                );

            color: #9be6b0;

            border-color:
                rgba(77,214,117,.15);
        }


        .spotify:hover {
            border-color:
                rgba(77,214,117,.27);
        }


        /* =========================================================
           LITTLE THINGS
        ========================================================= */

        .tools {
            margin-top: 23px;
        }


        .tool-grid {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;
        }


        .tool {
            position: relative;

            min-height: 62px;

            padding:
                12px
                13px;

            border-radius: 17px;

            border:
                1px solid
                rgba(177,143,239,.12);

            background:
                linear-gradient(
                    120deg,
                    rgba(37,31,48,.72),
                    rgba(18,16,25,.86)
                );

            color: #ddd6e5;

            font-family: inherit;

            display: flex;

            align-items: center;

            gap: 10px;

            text-align: left;

            cursor: pointer;

            box-shadow:
                inset 0 1px 0
                    rgba(255,255,255,.035);

            transition:
                transform .25s ease,
                border-color .25s ease,
                background .25s ease,
                box-shadow .25s ease;
        }


        .tool:hover {
            transform:
                translateY(-2px);

            border-color:
                rgba(177,143,239,.28);

            background:
                linear-gradient(
                    120deg,
                    rgba(48,39,64,.84),
                    rgba(22,19,30,.92)
                );

            box-shadow:
                0 12px 28px
                    rgba(0,0,0,.25),

                0 0 20px
                    rgba(167,139,250,.06);
        }


        .tool-icon {
            width: 33px;
            height: 33px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background:
                linear-gradient(
                    145deg,
                    rgba(167,139,250,.16),
                    rgba(255,255,255,.035)
                );

            border:
                1px solid
                rgba(190,160,250,.13);

            color: #bda5e5;

            font-size: 12px;
        }


        .tool-text {
            display: flex;

            flex-direction: column;

            gap: 3px;
        }


        .tool-title {
            color: #e9e2ee;

            font-size: 11px;

            font-weight: 600;
        }


        .tool-subtitle {
            color: #81788b;

            font-size: 9px;
        }


        /* =========================================================
           FOOTER
        ========================================================= */

        footer {
            text-align: center;

            padding:
                29px
                0
                4px;

            color: #56505f;

            font-size: 9px;

            letter-spacing: .7px;
        }


        footer span {
            color: #a38ac8;

            text-shadow:
                0 0 10px
                rgba(163,138,200,.35);
        }


        /* =========================================================
           TOAST
        ========================================================= */

        .toast {
            position: fixed;

            left: 50%;
            bottom: 25px;

            z-index: 100;

            transform:
                translate(-50%, 70px);

            padding:
                10px
                16px;

            border-radius: 50px;

            border:
                1px solid
                rgba(190,157,255,.18);

            background:
                rgba(24,20,32,.96);

            box-shadow:
                0 15px 40px
                rgba(0,0,0,.5),

                0 0 20px
                rgba(167,139,250,.07);

            color: #eee8f4;

            font-size: 11px;

            font-weight: 600;

            opacity: 0;

            pointer-events: none;

            transition:
                opacity .3s ease,
                transform .4s cubic-bezier(.16,1,.3,1);
        }


        .toast.show {
            opacity: 1;

            transform:
                translate(-50%, 0);
        }


        .toast i {
            color: #b99bea;

            margin-right: 7px;
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 520px) {

            body {
                padding:
                    35px
                    15px;
            }


            .name {
                font-size: 39px;
            }

        }


        @media (max-width: 360px) {

            .tool-grid {
                grid-template-columns:
                    1fr;
            }

        }


        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }

        }

    </style>
</head>


<body>

    <div class="background">
        <div class="ambient"></div>
        <div class="stars"></div>
    </div>

    <div class="grain"></div>


    <main class="page">


        <!-- PROFILE -->

        <section class="profile">

            <div class="avatar-wrap">

                <div class="avatar-glow"></div>
                <div class="avatar-ring"></div>

                <img
                    class="avatar"
                    src="https://lh3.googleusercontent.com/d/1iwzToyV8lFgr7TeKMuds3kDrl6YTuWfz"
                    alt="Marie"
                >

            </div>


            <h1 class="name">
                Marie
            </h1>


            <div class="identity">

                <strong>she / her</strong>

                <span class="dot">·</span>

                <strong>transfem</strong>

                <span class="dot">·</span>

                <strong>furry</strong>

            </div>


            <div class="bio-description">
                you can find me around the internet ↓
            </div>


            <div class="location">

                <i class="fa-solid fa-location-dot"></i>

                Quebec, Canada

            </div>

        </section>


        <!-- CLOCK -->

        <section class="clock-card">

            <div class="clock-left">

                <div class="clock-icon">
                    <i class="fa-regular fa-clock"></i>
                </div>


                <div class="clock-info">

                    <span class="clock-label">
                        Local time
                    </span>

                    <span
                        class="clock-time"
                        id="quebecTime"
                    >
                        --:--:--
                    </span>

                </div>

            </div>


            <div class="clock-zone">

                EDT<br>

                UTC−4

            </div>

        </section>


        <!-- LINKS -->

        <section>

            <div class="section-label">
                Find me
            </div>


            <div class="links">


                <!-- DISCORD -->

                <a
                    href="https://discord.com/users/544246551455858709"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="link discord"
                >

                    <div class="link-icon">

                        <i class="fa-brands fa-discord"></i>

                    </div>


                    <div class="link-info">

                        <span class="link-title">
                            Discord
                        </span>

                        <span class="link-subtitle">
                            Come say hi
                        </span>

                    </div>


                    <i
                        class="fa-solid fa-arrow-up-right-from-square link-arrow"
                    ></i>

                </a>


                <!-- ROBLOX -->

                <a
                    href="https://www.roblox.com/users/86445196/profile"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="link roblox"
                >

                    <div class="link-icon">

                        <img
                            class="roblox-logo"
                            src="https://upload.wikimedia.org/wikipedia/commons/6/6c/Roblox_Logo.svg"
                            alt="Roblox"
                        >

                    </div>


                    <div class="link-info">

                        <span class="link-title">
                            Roblox
                        </span>

                        <span class="link-subtitle">
                            Games & stuff
                        </span>

                    </div>


                    <i
                        class="fa-solid fa-arrow-up-right-from-square link-arrow"
                    ></i>

                </a>

    <script>

        /* =========================================================
           CLOCK
        ========================================================= */

        function updateTime() {

            const options = {
                timeZone: "America/Toronto",

                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",

                hour12: true
            };


            const time =
                new Intl.DateTimeFormat(
                    "en-US",
                    options
                ).format(
                    new Date()
                );


            document.getElementById(
                "quebecTime"
            ).textContent = time;

        }


        updateTime();


        setInterval(
            updateTime,
            1000
        );


        /* =========================================================
           COPY
        ========================================================= */

        let toastTimer;


        async function copyText(
            text,
            label
        ) {

            try {

                await navigator.clipboard.writeText(
                    text
                );


                showToast(
                    `${label} copied`
                );

            }

            catch {

                showToast(
                    "Couldn't copy"
                );

            }

        }


        /* =========================================================
           TOAST
        ========================================================= */

        function showToast(
            message
        ) {

            const toast =
                document.getElementById(
                    "toast"
                );


            const toastText =
                document.getElementById(
                    "toastText"
                );


            toastText.textContent =
                message;


            toast.classList.add(
                "show"
            );


            clearTimeout(
                toastTimer
            );


            toastTimer =
                setTimeout(
                    () => {

                        toast.classList.remove(
                            "show"
                        );

                    },
                    2200
                );

        }

    </script>
